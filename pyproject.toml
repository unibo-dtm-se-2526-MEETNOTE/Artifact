[tool.poetry]
name = "meetnote"
packages = [
    { include = "meetnote" },
]
version = "1.1.4"
description = "AI-assisted meeting transcription and action-item review desktop application"
authors = ["Sahand Atlasi <sahand.atlasi@studio.unibo.it>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/unibo-dtm-se-2526-MEETNOTE/Artifact"

[tool.poetry.dependencies]
# update the Python versions in .github/workflows/check.yml if you change this
python = ">= 3.11.0 < 3.14.0"
kivy = ">=2.3,<3.0"
google-genai = "^2.29.0"

[tool.poetry.group.dev.dependencies]
coverage = "^7.4.0"
mypy = "^1.10.1"
poethepoet = "^0.37.0"
poetry = "^1.8.3"
pytest = "^8.3.5"
ruff = "^0.15.0"

[tool.poetry.group.whisper]
optional = true

[tool.poetry.group.whisper.dependencies]
faster-whisper = "^1.2.1"

[tool.poe.tasks]
test = "pytest"
coverage = "coverage run -m pytest"
coverage-report = "coverage report -m"
coverage-html = "coverage html"
ruff-check = "ruff check"
ruff-fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --check"
mypy = "mypy meetnote tests"
compile = "python -m compileall meetnote tests"
static-checks = [
    "ruff-check",
    "mypy",
]

[tool.mypy]
python_version = "3.12"
# existing settings remain here

[[tool.mypy.overrides]]
module = ["meetnote.__main__", "meetnote.ui.*"]
ignore_errors = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.mypy.overrides]]
module = ["faster_whisper"]
ignore_missing_imports = true
